[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetconnect-backend"
version = "0.1.0"
description = "FastAPI backend for FleetConnect."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.16,<2.0",
  "edge-tts>=7.0,<8.0",
  "easyocr>=1.7,<2.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.135,<0.136",
  "faster-whisper>=1.1,<2.0",
  "httpx>=0.28,<0.29",
  "matplotlib>=3.10,<4.0",
  "numpy>=1.26,<3.0",
  "openpyxl>=3.1,<4.0",
  "opencv-python-headless>=4.10,<5.0",
  "pandas>=2.2,<3.0",
  "pillow>=11.0,<13.0",
  "pdfplumber>=0.11,<0.12",
  "psycopg2-binary>=2.9,<3.0",
  "pymupdf>=1.26,<2.0",
  "pytesseract>=0.3,<0.4",
  "pyttsx3>=2.90,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "python-jose>=3.5,<4.0",
  "python-multipart>=0.0.9,<0.1",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.41,<0.42",
  "xlrd>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.4,<9.0",
  "ruff>=0.11,<0.12",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["app", "tests"]
target-version = "py311"

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
