[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetconnect-backend"
version = "0.1.0"
description = "FastAPI backend for FleetConnect."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.135,<0.136",
  "httpx>=0.28,<0.29",
  "psycopg2-binary>=2.9,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "python-jose>=3.5,<4.0",
  "python-multipart>=0.0.9,<0.1",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.41,<0.42",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.4,<9.0",
  "ruff>=0.11,<0.12",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["app", "tests"]
target-version = "py312"

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
